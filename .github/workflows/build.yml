name: Build Karim Alsharabi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android Project
        run: |
          mkdir -p app/src/main/java/com/karimtravel/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi

          cp index.html app/src/main/assets/index.html
          cp MainActivity.java app/src/main/java/com/karimtravel/app/MainActivity.java
          cp ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KarimAlsharabi"
          include ':app'
          EOF

          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.karimtravel.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.karimtravel.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
          }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="كريم الشرعبي" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          sed -i 's/android:label="كريم الشرعبي"/android:label="كريم الشرعبي" android:icon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karim-Alsharabi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
